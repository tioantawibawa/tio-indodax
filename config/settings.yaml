# Non-secret configuration. Secrets live in .env (see .env.example).
# Every value under `risk:` is a HARD LIMIT: loaded once at startup into an
# immutable object; nothing in the agent (incl. the LLM) can change it at runtime.
# To change a hard limit: edit this file and restart the service.

exchange:
  environment: "production"
  public_base_url: "https://indodax.com"
  tapi_url: "https://indodax.com/tapi"            # legacy private API (HMAC-SHA512)
  tapi_v2_base_url: "https://api.indodax.com"     # Trade API 2.0 (HMAC-SHA256) — see notes §10 Q2
  public_rate_limit_per_min: 150                  # official limit is 180/min; keep headroom
  request_timeout_s: 10
  max_retries: 4
  backoff_base_s: 0.5
  backoff_max_s: 8
  recv_window_ms: 5000
  max_clock_offset_ms: 500                        # refuse to trade if VPS clock drifts more than this

market:
  whitelist: ["btc_idr", "eth_idr", "sol_idr", "xrp_idr", "doge_idr", "ada_idr"]   # +xrp/doge/ada 2026-10-04 (docs/backtest_phase3.md)
  min_volume_24h_idr: 1000000000                  # Rp 1 miliar — placeholder, please confirm
  max_spread_pct: 0.3
  max_slippage_pct: 0.2

cycle:
  interval_minutes: 5

fees:
  # Fallbacks; per-pair maker/taker fees from /api/pairs take precedence when present.
  maker_pct: 0.1
  taker_pct: 0.2
  tax_pct: 0.12                                   # seen as taxRate 0.0012 in private WS fills
  clearing_pct: 0.0222                            # seen as clearingRate 0.000222
  min_edge_multiple: 2.0                          # expected move must be >= 2x round-trip cost

risk:
  agent_capital_idr: 300000                       # owner 2026-10-04 (was 500000; Rp 500.000 confirmed earlier)
  max_position_pct: 45                            # owner 2026-10-07: portfolio manager vol 20% (was 10)
  max_open_positions: 6                           # owner 2026-10-07 (was 3)
  max_asset_exposure_pct: 45                      # owner 2026-10-07 (was 30)
  daily_loss_limit_pct: 6                         # owner 2026-10-07 (was 3)
  max_drawdown_pct: 40                            # owner 2026-10-07: kill switch (was 15)
  max_orders_per_hour: 10
  max_orders_per_day: 40
  stoploss_cooldown_minutes: 30
  require_stop_loss: true
  emergency_exit_max_slippage_pct: 1.0            # market orders only for emergency SL exits

deadman:
  enabled: true
  heartbeat_s: 30
  countdown_ms: 120000

live_gate:
  min_paper_days: 12                              # owner 2026-10-04: go live after 12 paper days (was 14)

reporting:
  timezone: "Asia/Jakarta"
  daily_report_time: "21:00"
  go_live_review_date: 2026-10-07                 # paper: /status + go-live readiness to Telegram
  go_live_review_time: "09:00"                    # WIB; repeated daily until ready

strategy:                                         # tunable; NOT hard limits (see docs/backtest_phase3.md)
  timeframes: ["1D"]                              # daily candles, 00:00 UTC
  lookback_bars: 300
  breakout_bars: 20                               # entry: close > highest high of prior 20 days
  trend_ema: 100                                  # ... and close > EMA100
  atr_period: 20
  chandelier_bars: 22                             # trailing SL = highest high(22) - 3 x ATR(20)
  chandelier_atr_mult: 3.0
  target_atr_mult: 4.0                            # expected move for the cost check only (no fixed TP)
  risk_per_trade_pct: 1.0                         # owner 2026-10-05: back to 1% (was 2.0, variant B)
  min_confidence: 0.55
  ema_fast: 20                                    # regime classification (reporting / LLM context)
  ema_slow: 50
  rsi_period: 14
  adx_period: 14
  adx_trend: 25
  adx_range: 20
  high_vol_atr_ratio: 2.0

portfolio:                                        # portfolio manager (docs/portfolio_manager.md); replaces strategy entries
  enabled: true                                   # owner 2026-10-07: vol-20% allocation, weekly review
  target_vol: 0.20                                # annualised portfolio volatility target
  trend_ema: 100                                  # only coins above their daily EMA100 are held
  vol_lookback: 30
  cov_lookback: 60
  max_weight: 0.45
  rebalance_days: 7                               # full refresh weekly ...
  react_to_changes: true                          # ... and re-plan at every daily close if the recommendation changed (owner 2026-10-07)
  alerts: true                                    # Telegram "potensi beli/jual" from Dika & Sinta
  alert_band_pct: 2.0                             # when the live price is within 2% of the trend line
  band_pct: 5.0                                   # skip trades < 5% of capital (min Rp 15.000)
  min_trade_idr: 15000
  stop_atr_mult: 6.0                              # fixed catastrophe stop, not trailed
  review_weekday: "mon"                           # periodic review: Monday 21:30 WIB (+ /review)
  review_time: "21:30"

llm:                                              # enabled via LLM_ENABLED in .env
  model: "claude-opus-5"
  effort: "low"
  timeout_s: 30
  max_confidence_adjust: 0.2
  veto_confidence: 0.7

storage:
  db_path: "data/agent.db"

logging:
  dir: "logs"
  level: "INFO"
